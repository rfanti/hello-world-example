  # job para empacotar o projeto
  package:
    runs-on: ubuntu-latest
    needs: test  # Garante que o job 'test' seja executado com sucesso antes do 'package'
    steps:
      # Ação para clonar o repositório
      - name: Checkout code
        uses: actions/checkout@main

      # Ação para configurar o JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@main
        with:
          distribution: 'temurin'
          java-version: '17'

      # Ação para empacotar o projeto com Maven
      - name: Package JAR
        run: mvn package

      # Ação para armazenar o artefato JAR
      - name: Upload JAR artifact
        uses: actions/upload-artifact@main
        with:
          name: hello-world-grupo4
          path: target/*.jar

  # job para realizar o deploy do projeto
