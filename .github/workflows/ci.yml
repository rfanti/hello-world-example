      # Ação para gerar o relatório de cobertura de código
      - name: Generate Code Coverage Report
        run: mvn jacoco:report -DoutputDirectory=target/jacoco-report/
      
      - name: Archive Test Results
        uses: actions/upload-artifact@main
        with:
