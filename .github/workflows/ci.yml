name: CI/CD Pipeline

on:  
  # regra pull_request apenas para a branch main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # job para construir o projeto
  build:
    runs-on: ubuntu-latest
    steps:
      # Ação para clonar o repositório
      - name: Check out the repository
        uses: actions/checkout@main

      # Ação para configurar o JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@main
        with:
          distribution: 'temurin'
          java-version: '17'

      # Ação para armazenar em cache as dependências do Maven
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Ação para construir o projeto com Maven
      - name: Build with Maven
        run: mvn clean install

  # job para testar o projeto
  test:
    runs-on: ubuntu-latest
    needs: build  # Garante que o job 'build' seja executado com sucesso antes do 'test'
    steps:
      # Ação para clonar o repositório
      - name: Checkout code
        uses: actions/checkout@v4

      # Ação para configurar o JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # Ação para executar o Checkstyle
      - name: Run checkstyle
        run: mvn checkstyle:check

      # Ação para executar os testes com Maven
      - name: Run tests with Maven
        run: mvn clean test
        
